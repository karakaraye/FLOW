# FlowPilot AI - Render Blueprint Spec
# Reference: https://render.com/docs/blueprint-spec
services:
  # 1. FlowPilot Web Service
  - type: web
    name: flowpilot-web
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLOWPILOT_ENV
        value: production
      - key: FLOWPILOT_PROCESS_ROLE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: flowpilot-db
          property: connectionString
      - key: BETTER_AUTH_URL
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: OPERATIONS_TOKEN
        generateValue: true
      - key: DB_POOL_MAX
        value: "10"
      - key: AUTH_REGISTRATION_ENABLED
        value: "true"

  # 2. FlowPilot Durable Queue Worker
  - type: worker
    name: flowpilot-worker
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: node --import tsx scripts/worker.ts
    plan: starter
    region: oregon
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLOWPILOT_ENV
        value: production
      - key: FLOWPILOT_PROCESS_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: flowpilot-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: flowpilot-web
          envVarKey: BETTER_AUTH_SECRET
      - key: OPERATIONS_TOKEN
        fromService:
          type: web
          name: flowpilot-web
          envVarKey: OPERATIONS_TOKEN
      - key: DB_POOL_MAX
        value: "5"

databases:
  - name: flowpilot-db
    plan: starter
    region: oregon
    postgresMajorVersion: "17"

